<svg
  width="256"
  height="256"
  viewBox="0 0 256 256"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="LapQuest logo"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fc" />
      <stop offset="100%" stop-color="#fde6d8" />
    </linearGradient>

    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6cff" />
      <stop offset="100%" stop-color="#3f46a3" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect
    x="16"
    y="16"
    width="224"
    height="224"
    rx="48"
    fill="url(#bg)"
    filter="url(#shadow)"
  />

  <circle cx="84" cy="108" r="10" fill="#ff8a3d" />

  <rect x="112" y="72" width="10" height="112" rx="5" fill="url(#pole)" />

  <path
    d="M122 76
       C146 66, 170 76, 194 68
       L194 128
       C170 136, 146 126, 122 136
       Z"
    fill="#ffffff"
  />

  <g fill="#1f2937">
    <rect x="130" y="80" width="16" height="16" />
    <rect x="162" y="80" width="16" height="16" />
    <rect x="146" y="96" width="16" height="16" />
    <rect x="178" y="96" width="16" height="16" />
    <rect x="130" y="112" width="16" height="16" />
    <rect x="162" y="112" width="16" height="16" />
  </g>
</svg>
